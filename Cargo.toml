[package]
name = "mickey"
version = "1.3.2"
edition = "2024"
description = "Lightweight Windows microphone mute hotkey with status tray icons and GitHub Releases updates"
license = "MIT"
repository = "https://github.com/Samsxx001/MicKey"

[dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

