name: Release Windows
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MICKEY_REPOSITORY: ${{ github.repository }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag and run tests
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag must match the version in Cargo.toml.' }
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test update validation
        shell: powershell
        run: ./tests/updater.ps1
      - name: Test install and rollback
        shell: powershell
        run: ./tests/update-install.ps1
      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist, package | Out-Null
          Copy-Item target/release/mickey.exe dist/MicKey.exe
          Copy-Item dist/MicKey.exe, README.txt, LICENSE, CHANGELOG.md package/
          Compress-Archive -Path package/* -DestinationPath dist/MicKey-windows-x86_64.zip
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish download assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/MicKey.exe dist/MicKey-windows-x86_64.zip dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/MicKey.exe dist/MicKey-windows-x86_64.zip dist/SHA256SUMS.txt --verify-tag --title "MicKey $env:GITHUB_REF_NAME" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
