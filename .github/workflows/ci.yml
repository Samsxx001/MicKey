name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust formatting and tests
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test update validation
        shell: powershell
        run: ./tests/updater.ps1
      - name: Test install and rollback
        shell: powershell
        run: ./tests/update-install.ps1
